<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #000;
    --fg: #f5f5f7;
    --muted: rgba(245, 245, 247, 0.56);
    --glass: rgba(255, 255, 255, 0.06);
    --glass-strong: rgba(255, 255, 255, 0.1);
    --stroke: rgba(255, 255, 255, 0.12);
    --accent: #2997ff;
    --grad: linear-gradient(90deg, #ff6b9d 0%, #c471f5 30%, #6e8bff 60%, #2fd8ff 100%);
    --radius: 28px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --font: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Inter", "Noto Sans Thai", system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    min-height: 100dvh;
  }

  /* ---------- Aurora background ---------- */
  .aurora {
    position: fixed;
    inset: -20vmax;
    z-index: 0;
    filter: blur(80px) saturate(140%);
    opacity: 0.55;
    pointer-events: none;
  }
  .blob {
    position: absolute;
    width: 55vmax;
    height: 55vmax;
    border-radius: 50%;
    mix-blend-mode: screen;
    animation: drift 24s var(--ease) infinite alternate;
  }
  .blob.b1 { background: radial-gradient(circle, #ff3d8b 0%, transparent 60%); top: 0; left: 5%; }
  .blob.b2 { background: radial-gradient(circle, #6e5bff 0%, transparent 60%); top: 20%; right: 0; animation-duration: 30s; animation-delay: -8s; }
  .blob.b3 { background: radial-gradient(circle, #00c8ff 0%, transparent 60%); bottom: 0; left: 25%; animation-duration: 36s; animation-delay: -16s; }

  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1) rotate(0deg); }
    50%  { transform: translate(8vmax, -6vmax) scale(1.15) rotate(40deg); }
    100% { transform: translate(-6vmax, 8vmax) scale(0.9) rotate(-30deg); }
  }

  .grain {
    position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.06;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* ---------- Layout ---------- */
  main {
    position: relative;
    z-index: 2;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 96px 16px 64px;
    gap: 48px;
  }

  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }
  .brand { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--grad); box-shadow: 0 0 12px #c471f5; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.5); opacity: 0.6; } }

  .pill-btn {
    appearance: none;
    border: 0;
    cursor: pointer;
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    color: #fff;
    background: var(--accent);
    padding: 8px 18px;
    border-radius: 999px;
    transition: transform 0.3s var(--ease), background 0.3s, box-shadow 0.3s;
  }
  .pill-btn:hover { background: #0077ed; box-shadow: 0 8px 24px rgba(41, 151, 255, 0.35); }
  .pill-btn:active { transform: scale(0.95); }
  .pill-btn.ghost { background: var(--glass-strong); }
  .pill-btn.ghost:hover { background: rgba(255,255,255,0.18); box-shadow: none; }

  /* ---------- Hero ---------- */
  .hero { text-align: center; max-width: 1100px; }
  .eyebrow {
    font-size: clamp(15px, 2vw, 19px);
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 14px;
    letter-spacing: 0.01em;
  }
  .title {
    font-size: clamp(40px, 8vw, 96px);
    line-height: 1.04;
    font-weight: 700;
    letter-spacing: -0.035em;
    background: var(--grad);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 8s linear infinite;
    word-break: break-word;
    padding-bottom: 0.08em;
  }
  @keyframes shine { to { background-position: 200% center; } }
  .target-date {
    margin-top: 16px;
    font-size: clamp(16px, 2.2vw, 22px);
    color: var(--muted);
    font-weight: 400;
  }

  /* ---------- Units grid ---------- */
  .grid {
    width: 100%;
    max-width: 1180px;
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 14px;
  }
  .card {
    position: relative;
    background: var(--glass);
    border: 1px solid var(--stroke);
    border-radius: var(--radius);
    padding: 28px 8px 22px;
    text-align: center;
    backdrop-filter: blur(30px) saturate(160%);
    -webkit-backdrop-filter: blur(30px) saturate(160%);
    overflow: hidden;
    transition: transform 0.6s var(--ease), border-color 0.6s, background 0.6s;
    opacity: 0;
    transform: translateY(40px) scale(0.96);
    animation: rise 1s var(--ease) forwards;
  }
  .card::before {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,0.12), transparent 60%);
    pointer-events: none;
  }
  .card:hover { transform: translateY(-6px) scale(1.02); border-color: rgba(255,255,255,0.28); background: var(--glass-strong); }
  .card.zero .digits { opacity: 0.32; }
  .card.tick { animation: rise 1s var(--ease) forwards, glow 0.9s var(--ease); }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @keyframes glow {
    0% { box-shadow: 0 0 0 0 rgba(41,151,255,0.0); }
    30% { box-shadow: 0 0 40px 0 rgba(110,139,255,0.35); }
    100% { box-shadow: 0 0 0 0 rgba(41,151,255,0.0); }
  }

  .digits {
    display: inline-flex;
    justify-content: center;
    font-size: clamp(30px, 5vw, 64px);
    font-weight: 700;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    height: 1em;
    transition: opacity 0.6s;
  }
  /* Rolling digit */
  .digit {
    position: relative;
    display: inline-block;
    width: 0.62em;
    height: 1em;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(transparent 0%, #000 18%, #000 82%, transparent 100%);
            mask-image: linear-gradient(transparent 0%, #000 18%, #000 82%, transparent 100%);
  }
  .digit .strip {
    position: absolute;
    left: 0; right: 0; top: 0;
    display: flex;
    flex-direction: column;
    transition: transform 0.7s var(--ease);
    will-change: transform;
  }
  .digit .strip span { height: 1em; display: block; text-align: center; }

  .label {
    margin-top: 14px;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
  .label small { display: block; font-size: 11px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.12em; margin-top: 2px; }

  /* ---------- Progress ring / total line ---------- */
  .total {
    font-size: 15px;
    color: var(--muted);
    text-align: center;
    max-width: 90vw;
  }
  .total b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---------- Done state ---------- */
  .done {
    display: none;
    text-align: center;
    flex-direction: column;
    gap: 12px;
    align-items: center;
  }
  .done h2 {
    font-size: clamp(48px, 10vw, 120px);
    font-weight: 800;
    letter-spacing: -0.04em;
    background: var(--grad);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: pop 1s var(--ease);
  }
  .done p { color: var(--muted); font-size: 19px; }
  @keyframes pop { from { transform: scale(0.6); opacity: 0; } }
  body.finished .grid, body.finished .total { display: none; }
  body.finished .done { display: flex; }

  /* ---------- Empty state ---------- */
  .empty { display: none; text-align: center; flex-direction: column; align-items: center; gap: 22px; animation: pop 1s var(--ease); }
  .empty h1 { font-size: clamp(44px, 9vw, 104px); font-weight: 700; letter-spacing: -0.04em; line-height: 1.12; padding-bottom: 0.1em; }
  .empty h1 span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .empty p { color: var(--muted); font-size: clamp(17px, 2.2vw, 21px); max-width: 560px; }
  .empty .pill-btn { font-size: 17px; padding: 12px 26px; }
  body.no-target .hero, body.no-target .grid, body.no-target .total, body.no-target .done { display: none !important; }
  body.no-target .empty { display: flex; }

  /* ---------- Sheet (settings) ---------- */
  .scrim {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s var(--ease);
  }
  .sheet {
    position: fixed; z-index: 21;
    left: 50%; top: 50%;
    width: min(460px, calc(100vw - 32px));
    transform: translate(-50%, -44%) scale(0.94);
    opacity: 0; pointer-events: none;
    transition: transform 0.5s var(--ease), opacity 0.4s var(--ease);
    background: rgba(28, 28, 30, 0.82);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 1px solid var(--stroke);
    border-radius: 30px;
    padding: 28px 24px 24px;
    box-shadow: 0 40px 100px rgba(0,0,0,0.6);
  }
  body.sheet-open .scrim { opacity: 1; pointer-events: auto; }
  body.sheet-open .sheet { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }

  .sheet h3 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 4px; }
  .sheet .sub { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
  .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .field label { font-size: 13px; font-weight: 500; color: var(--muted); padding-left: 4px; }
  .field label i { font-style: normal; opacity: 0.6; }
  .field input {
    font: inherit;
    font-size: 17px;
    color: var(--fg);
    background: rgba(118, 118, 128, 0.24);
    border: 1px solid transparent;
    border-radius: 14px;
    padding: 13px 16px;
    outline: none;
    color-scheme: dark;
    transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
    width: 100%;
  }
  .field input:focus { border-color: var(--accent); background: rgba(118,118,128,0.32); box-shadow: 0 0 0 4px rgba(41,151,255,0.2); }
  .row { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; }

  .presets { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 22px; }
  .chip {
    appearance: none; border: 1px solid var(--stroke); background: transparent; color: var(--fg);
    font: inherit; font-size: 13px; padding: 7px 13px; border-radius: 999px; cursor: pointer;
    transition: background 0.25s, transform 0.25s var(--ease);
  }
  .chip:hover { background: var(--glass-strong); }
  .chip:active { transform: scale(0.94); }

  .actions { display: flex; gap: 10px; }
  .actions .pill-btn { flex: 1; padding: 13px; font-size: 16px; }
  .error { color: #ff6b6b; font-size: 13px; min-height: 18px; margin: -6px 0 10px 4px; }

  .toast {
    position: fixed; z-index: 30; left: 50%; bottom: 28px;
    transform: translate(-50%, 30px); opacity: 0;
    background: rgba(40,40,44,0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--stroke);
    padding: 11px 20px; border-radius: 999px; font-size: 14px;
    transition: transform 0.5s var(--ease), opacity 0.4s;
    pointer-events: none;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }

  canvas#confetti { position: fixed; inset: 0; z-index: 15; pointer-events: none; }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px) {
    .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  @media (max-width: 900px) and (min-width: 561px) {
    /* center the last 3 cards */
    .grid { grid-template-columns: repeat(12, minmax(0, 1fr)); }
    .card { grid-column: span 3; }
    .card:nth-child(5) { grid-column: 2 / span 3; }
    .card:nth-child(6), .card:nth-child(7) { grid-column: span 3; }
  }
  @media (max-width: 560px) {
    main { gap: 36px; padding-top: 88px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .card { padding: 22px 6px 18px; border-radius: 22px; }
    .card:nth-child(7) { grid-column: 1 / -1; }
    .digits { font-size: 44px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }
</style>
</head>
<body class="no-target">
  <div class="aurora" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>
  <div class="grain" aria-hidden="true"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <nav>
    <div class="brand"><span class="dot"></span>Countdown</div>
    <div style="display:flex;gap:8px">
      <button class="pill-btn ghost" id="shareBtn" type="button">แชร์</button>
      <button class="pill-btn" id="editBtn" type="button">ตั้งเวลา</button>
    </div>
  </nav>

  <main>
    <section class="empty">
      <h1>นับถอยหลัง<br /><span>สู่วันสำคัญ</span></h1>
      <p>ตั้งวันและเวลาที่รอคอย แล้วดูว่าเหลืออีกกี่ปี เดือน สัปดาห์ วัน ชั่วโมง นาที และวินาที</p>
      <button class="pill-btn" id="startBtn" type="button">เริ่มต้นเลย</button>
    </section>

    <header class="hero">
      <div class="eyebrow">เหลือเวลาอีก</div>
      <h1 class="title" id="title">Countdown</h1>
      <div class="target-date" id="targetText"></div>
    </header>

    <section class="grid" id="grid" aria-live="off"></section>

    <div class="total" id="total"></div>

    <section class="done">
      <h2>ถึงแล้ว! 🎉</h2>
      <p id="doneText"></p>
    </section>
  </main>

  <div class="scrim" id="scrim"></div>
  <form class="sheet" id="sheet" autocomplete="off">
    <h3>ตั้งเวลานับถอยหลัง</h3>
    <div class="sub">เลือกวันและเวลาเป้าหมายของคุณ</div>

    <div class="field">
      <label for="titleInput">ชื่อ <i>(ไม่บังคับ)</i></label>
      <input id="titleInput" type="text" maxlength="80" placeholder="เช่น ปีใหม่ 2027, วันเกิด, ทริปญี่ปุ่น" />
    </div>

    <div class="row">
      <div class="field">
        <label for="dateInput">วันที่</label>
        <input id="dateInput" type="date" required />
      </div>
      <div class="field">
        <label for="timeInput">เวลา</label>
        <input id="timeInput" type="time" step="1" value="00:00:00" />
      </div>
    </div>
    <div class="error" id="error"></div>

    <div class="presets" id="presets"></div>

    <div class="actions">
      <button class="pill-btn ghost" type="button" id="cancelBtn">ยกเลิก</button>
      <button class="pill-btn" type="submit">เริ่มนับ</button>
    </div>
  </form>

  <div class="toast" id="toast"></div>

<script>
(() => {
  const UNITS = [
    { key: "years",   th: "ปี",       en: "Years" },
    { key: "months",  th: "เดือน",    en: "Months" },
    { key: "weeks",   th: "สัปดาห์",  en: "Weeks" },
    { key: "days",    th: "วัน",      en: "Days" },
    { key: "hours",   th: "ชั่วโมง",  en: "Hours" },
    { key: "minutes", th: "นาที",     en: "Minutes" },
    { key: "seconds", th: "วินาที",   en: "Seconds" },
  ];
  const STORE_KEY = "countdown.v1";

  const $ = (id) => document.getElementById(id);
  const body = document.body;
  const grid = $("grid");

  // ---------- Build cards ----------
  const cards = {};
  UNITS.forEach((u, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.style.animationDelay = `${0.15 + i * 0.07}s`;
    card.innerHTML = `<div class="digits"></div><div class="label">${u.th}<small>${u.en}</small></div>`;
    grid.appendChild(card);
    cards[u.key] = { el: card, digitsEl: card.querySelector(".digits"), digits: [], value: null };
  });

  function makeDigit() {
    const d = document.createElement("span");
    d.className = "digit";
    const strip = document.createElement("span");
    strip.className = "strip";
    for (let n = 0; n <= 9; n++) {
      const s = document.createElement("span");
      s.textContent = n;
      strip.appendChild(s);
    }
    d.appendChild(strip);
    return { el: d, strip };
  }

  function setValue(key, value) {
    const c = cards[key];
    if (c.value === value) return;
    const str = String(value).padStart(2, "0");
    while (c.digits.length < str.length) {
      const d = makeDigit();
      c.digitsEl.prepend(d.el);
      c.digits.unshift(d);
    }
    while (c.digits.length > str.length) {
      c.digits.shift().el.remove();
    }
    str.split("").forEach((ch, i) => {
      c.digits[i].strip.style.transform = `translateY(-${Number(ch)}em)`;
    });
    if (c.value !== null) {
      c.el.classList.remove("tick");
      void c.el.offsetWidth;
      c.el.classList.add("tick");
    }
    c.el.classList.toggle("zero", value === 0);
    c.value = value;
  }

  // ---------- Calendar-accurate diff ----------
  function addMonths(date, n) {
    const d = new Date(date.getTime());
    const day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + n);
    const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(day, last));
    return d;
  }

  function diff(from, to) {
    let totalMonths = (to.getFullYear() - from.getFullYear()) * 12 + (to.getMonth() - from.getMonth());
    if (totalMonths < 0) totalMonths = 0;
    while (totalMonths > 0 && addMonths(from, totalMonths) > to) totalMonths--;
    const anchor = addMonths(from, totalMonths);
    let rest = Math.max(0, Math.floor((to - anchor) / 1000));

    const years = Math.floor(totalMonths / 12);
    const months = totalMonths % 12;
    const weeks = Math.floor(rest / 604800); rest %= 604800;
    const days = Math.floor(rest / 86400);   rest %= 86400;
    const hours = Math.floor(rest / 3600);   rest %= 3600;
    const minutes = Math.floor(rest / 60);
    const seconds = rest % 60;
    return { years, months, weeks, days, hours, minutes, seconds };
  }

  // ---------- State ----------
  let state = loadState();
  let timer = null;
  let celebrated = false;

  function loadState() {
    const p = new URLSearchParams(location.search);
    if (p.get("t")) {
      const t = Number(p.get("t")) || Date.parse(p.get("t"));
      if (!isNaN(t)) return { target: t, title: p.get("title") || "" };
    }
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
      if (s && typeof s.target === "number") return s;
    } catch {}
    return null;
  }

  function saveState() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch {}
    const p = new URLSearchParams();
    p.set("t", String(state.target));
    if (state.title) p.set("title", state.title);
    history.replaceState(null, "", `${location.pathname}?${p}`);
  }

  const fmtDate = new Intl.DateTimeFormat("th-TH", {
    weekday: "long", day: "numeric", month: "long", year: "numeric",
    hour: "2-digit", minute: "2-digit",
  });
  const fmtNum = new Intl.NumberFormat("th-TH");

  function render() {
    if (!state) {
      body.classList.add("no-target");
      document.title = "Countdown";
      return;
    }
    body.classList.remove("no-target");
    const target = new Date(state.target);
    const now = new Date();
    const titleText = state.title || "Countdown";
    $("title").textContent = titleText;
    $("targetText").textContent = fmtDate.format(target);

    if (now >= target) {
      body.classList.add("finished");
      $("doneText").textContent = `${state.title ? state.title + " · " : ""}${fmtDate.format(target)}`;
      document.title = `🎉 ${titleText}`;
      if (!celebrated) { celebrated = true; confetti(); }
      return;
    }
    body.classList.remove("finished");
    celebrated = false;

    const d = diff(now, target);
    UNITS.forEach((u) => setValue(u.key, d[u.key]));

    const totalSec = Math.floor((target - now) / 1000);
    $("total").innerHTML =
      `รวมทั้งหมด <b>${fmtNum.format(Math.floor(totalSec / 86400))}</b> วัน · ` +
      `<b>${fmtNum.format(Math.floor(totalSec / 3600))}</b> ชั่วโมง · ` +
      `<b>${fmtNum.format(totalSec)}</b> วินาที`;

    document.title = `${d.years ? d.years + "ป " : ""}${d.months ? d.months + "ด " : ""}${d.weeks * 7 + d.days}ว ${String(d.hours).padStart(2, "0")}:${String(d.minutes).padStart(2, "0")}:${String(d.seconds).padStart(2, "0")} · ${titleText}`;
  }

  function start() {
    clearTimeout(timer);
    const loop = () => {
      render();
      timer = setTimeout(loop, 1000 - (Date.now() % 1000) + 5);
    };
    loop();
  }

  // ---------- Sheet ----------
  const pad = (n) => String(n).padStart(2, "0");
  const toDateStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const toTimeStr = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;

  function openSheet() {
    const base = state ? new Date(state.target) : new Date(new Date().getFullYear() + 1, 0, 1);
    $("titleInput").value = state ? state.title : "";
    $("dateInput").value = toDateStr(base);
    $("timeInput").value = toTimeStr(base);
    $("error").textContent = "";
    body.classList.add("sheet-open");
    setTimeout(() => $("titleInput").focus(), 300);
  }
  function closeSheet() { body.classList.remove("sheet-open"); }

  const presets = (() => {
    const now = new Date();
    const y = now.getFullYear();
    const list = [
      { label: `ปีใหม่ ${y + 1}`, title: `ปีใหม่ ${y + 1}`, date: new Date(y + 1, 0, 1) },
      { label: "สงกรานต์", title: "สงกรานต์", date: new Date(now < new Date(y, 3, 13) ? y : y + 1, 3, 13) },
      { label: "คริสต์มาส", title: "คริสต์มาส", date: new Date(now < new Date(y, 11, 25) ? y : y + 1, 11, 25) },
      { label: "อีก 100 วัน", title: "100 วันจากนี้", date: new Date(y, now.getMonth(), now.getDate() + 100) },
    ];
    return list;
  })();
  presets.forEach((p) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = p.label;
    b.onclick = () => {
      $("titleInput").value = p.title;
      $("dateInput").value = toDateStr(p.date);
      $("timeInput").value = "00:00:00";
    };
    $("presets").appendChild(b);
  });

  $("sheet").addEventListener("submit", (e) => {
    e.preventDefault();
    const date = $("dateInput").value;
    const time = $("timeInput").value || "00:00";
    if (!date) { $("error").textContent = "กรุณาเลือกวันที่"; return; }
    const [Y, M, D] = date.split("-").map(Number);
    const [h, m, s = 0] = time.split(":").map(Number);
    const target = new Date(Y, M - 1, D, h, m, s);
    if (isNaN(target)) { $("error").textContent = "วันที่ไม่ถูกต้อง"; return; }
    if (target <= new Date()) { $("error").textContent = "กรุณาเลือกเวลาในอนาคต"; return; }
    state = { target: target.getTime(), title: $("titleInput").value.trim() };
    saveState();
    UNITS.forEach((u) => { cards[u.key].value = null; });
    grid.querySelectorAll(".card").forEach((c) => {
      c.style.animation = "none"; void c.offsetWidth; c.style.animation = "";
    });
    closeSheet();
    start();
  });

  $("editBtn").onclick = openSheet;
  $("startBtn").onclick = openSheet;
  $("cancelBtn").onclick = closeSheet;
  $("scrim").onclick = closeSheet;
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

  $("shareBtn").onclick = async () => {
    if (!state) { openSheet(); return; }
    const url = location.href;
    try {
      if (navigator.share) { await navigator.share({ title: state.title || "Countdown", url }); return; }
      await navigator.clipboard.writeText(url);
      toast("คัดลอกลิงก์แล้ว");
    } catch { /* user cancelled */ }
  };

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove("show"), 2000);
  }

  // ---------- Confetti ----------
  function confetti() {
    const cv = $("confetti");
    const ctx = cv.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    ctx.scale(dpr, dpr);
    const colors = ["#ff6b9d", "#c471f5", "#6e8bff", "#2fd8ff", "#ffd36e", "#ffffff"];
    const parts = Array.from({ length: 180 }, () => ({
      x: innerWidth / 2, y: innerHeight / 2,
      vx: (Math.random() - 0.5) * 18, vy: Math.random() * -18 - 4,
      r: Math.random() * 6 + 3, c: colors[(Math.random() * colors.length) | 0],
      a: Math.random() * Math.PI, va: (Math.random() - 0.5) * 0.3,
    }));
    let frame = 0;
    (function tick() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      parts.forEach((p) => {
        p.vy += 0.4; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.a += p.va;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
        ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
        ctx.restore();
      });
      if (++frame < 240) requestAnimationFrame(tick);
      else ctx.clearRect(0, 0, innerWidth, innerHeight);
    })();
  }

  // ---------- Init ----------
  if (state) { saveState(); start(); } else { render(); }
})();
</script>
</body>
</html>
